<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Session Tracker</title>
<style>
  :root {
    --ink: #11161d;
    --panel: #1b222c;
    --panel-edge: #2a3340;
    --ember: #e3a042;
    --ember-dim: #8a6530;
    --mist: #8793a3;
    --paper: #ece7da;
    --pine: #5c9b76;
    --rust: #c77b63;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 48px 20px 80px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 2rem;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  .tagline {
    color: var(--mist);
    font-size: 0.95rem;
    margin: 0;
  }

  .timer-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 36px 24px 28px;
    text-align: center;
  }

  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto 20px;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-track { stroke: var(--panel-edge); }
  .ring-progress {
    stroke: var(--ember);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  @media (prefers-reduced-motion: reduce) {
    .ring-progress { transition: none; }
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .time-display {
    font-family: var(--mono);
    font-size: 2.6rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .mode-label {
    color: var(--mist);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0 18px;
    flex-wrap: wrap;
  }

  button {
    font-family: var(--sans);
    font-size: 0.92rem;
    border-radius: 9px;
    border: 1px solid var(--panel-edge);
    background: transparent;
    color: var(--paper);
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { border-color: var(--mist); }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  button.primary {
    background: var(--ember);
    border-color: var(--ember);
    color: #1a1304;
    font-weight: 600;
  }
  button.primary:hover { background: #edb15c; }

  .setup-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    color: var(--mist);
    margin-bottom: 4px;
    text-align: left;
  }

  input[type="number"], input[type="text"] {
    background: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: 7px;
    color: var(--paper);
    font-family: var(--sans);
    font-size: 0.9rem;
    padding: 7px 10px;
    width: 100%;
  }
  input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

  .field { width: 90px; }
  .field.wide { width: 180px; }

  .banner {
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--pine);
    min-height: 1.2em;
  }

  section.stats {
    margin-top: 44px;
  }

  .stats-row {
    display: flex;
    gap: 28px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .stat {
    flex: 1;
    min-width: 120px;
  }

  .stat .num {
    font-family: var(--serif);
    font-size: 1.9rem;
  }

  .stat .label {
    color: var(--mist);
    font-size: 0.82rem;
    margin-top: 2px;
  }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 90px;
    margin: 10px 0 34px;
  }

  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
    justify-content: flex-end;
  }

  .bar {
    width: 100%;
    max-width: 30px;
    background: var(--ember-dim);
    border-radius: 4px 4px 0 0;
    min-height: 3px;
  }

  .bar.today { background: var(--ember); }

  .bar-day {
    color: var(--mist);
    font-size: 0.72rem;
  }

  h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.2rem;
    margin: 0 0 14px;
  }

  .session-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--panel-edge);
    font-size: 0.9rem;
  }

  .session-row .meta { color: var(--mist); font-size: 0.8rem; }
  .session-row .subject { font-weight: 600; }

  .session-row button.delete {
    border: none;
    color: var(--rust);
    padding: 2px 6px;
    font-size: 1rem;
  }
  .session-row button.delete:hover { background: rgba(199,123,99,0.12); }

  .empty-state {
    color: var(--mist);
    font-size: 0.9rem;
    padding: 20px 0;
    text-align: center;
  }

  .danger-zone {
    margin-top: 48px;
    text-align: center;
  }

  .danger-zone button {
    font-size: 0.8rem;
    color: var(--mist);
    border-color: var(--panel-edge);
  }
  .danger-zone button:hover { color: var(--rust); border-color: var(--rust); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Study Session Tracker</h1>
    <p class="tagline">A quiet timer that remembers what you worked on.</p>
  </header>

  <div class="timer-card">
    <div class="ring-wrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="96" fill="none" stroke-width="10"/>
        <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="96" fill="none" stroke-width="10"
                stroke-dasharray="603" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-label">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="mode-label" id="modeLabel">Ready to study</div>
      </div>
    </div>

    <div class="setup-row" id="setupRow">
      <div class="field">
        <label for="workMinutes">Study (min)</label>
        <input type="number" id="workMinutes" value="25" min="1" max="180">
      </div>
      <div class="field">
        <label for="breakMinutes">Break (min)</label>
        <input type="number" id="breakMinutes" value="5" min="1" max="60">
      </div>
      <div class="field wide">
        <label for="subjectInput">Subject</label>
        <input type="text" id="subjectInput" placeholder="e.g. ECE 422C">
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="startBtn">Start studying</button>
      <button id="pauseBtn" style="display:none">Pause</button>
      <button id="resumeBtn" style="display:none">Resume</button>
      <button id="stopBtn" style="display:none">Stop</button>
      <button id="breakBtn" style="display:none">Start break</button>
    </div>

    <div class="banner" id="banner"></div>
  </div>

  <section class="stats">
    <div class="stats-row">
      <div class="stat">
        <div class="num" id="totalHours">0</div>
        <div class="label">Hours logged</div>
      </div>
      <div class="stat">
        <div class="num" id="totalSessions">0</div>
        <div class="label">Sessions</div>
      </div>
      <div class="stat">
        <div class="num" id="streak">0</div>
        <div class="label">Day streak</div>
      </div>
    </div>

    <h2>Last 7 days</h2>
    <div class="chart" id="chart"></div>

    <h2>Recent sessions</h2>
    <div id="sessionList"></div>
  </section>

  <div class="danger-zone">
    <button id="clearBtn">Clear all data</button>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'studyTrackerSessions';
  var CIRCUMFERENCE = 2 * Math.PI * 96;

  var state = {
    phase: 'idle',        // idle | working | paused | break
    remainingSeconds: 0,
    totalSeconds: 0,
    timerId: null,
    currentSubject: ''
  };

  var els = {
    workMinutes: document.getElementById('workMinutes'),
    breakMinutes: document.getElementById('breakMinutes'),
    subjectInput: document.getElementById('subjectInput'),
    timeDisplay: document.getElementById('timeDisplay'),
    modeLabel: document.getElementById('modeLabel'),
    ringProgress: document.getElementById('ringProgress'),
    startBtn: document.getElementById('startBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    resumeBtn: document.getElementById('resumeBtn'),
    stopBtn: document.getElementById('stopBtn'),
    breakBtn: document.getElementById('breakBtn'),
    banner: document.getElementById('banner'),
    totalHours: document.getElementById('totalHours'),
    totalSessions: document.getElementById('totalSessions'),
    streak: document.getElementById('streak'),
    chart: document.getElementById('chart'),
    sessionList: document.getElementById('sessionList'),
    clearBtn: document.getElementById('clearBtn')
  };

  els.ringProgress.setAttribute('stroke-dasharray', CIRCUMFERENCE.toFixed(1));

  function loadSessions() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Could not read sessions', e);
      return [];
    }
  }

  function saveSessions(sessions) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    } catch (e) {
      console.error('Could not save sessions', e);
    }
  }

  function formatTime(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateRing() {
    var fraction = state.totalSeconds > 0
      ? state.remainingSeconds / state.totalSeconds
      : 0;
    var offset = CIRCUMFERENCE * (1 - fraction);
    els.ringProgress.setAttribute('stroke-dashoffset', offset.toFixed(1));
  }

  function setButtons(visible) {
    els.startBtn.style.display = visible.start ? '' : 'none';
    els.pauseBtn.style.display = visible.pause ? '' : 'none';
    els.resumeBtn.style.display = visible.resume ? '' : 'none';
    els.stopBtn.style.display = visible.stop ? '' : 'none';
    els.breakBtn.style.display = visible.breakBtn ? '' : 'none';
    els.setupRowDisabled(visible.setupEnabled);
  }

  els.setupRowDisabled = function (enabled) {
    els.workMinutes.disabled = !enabled;
    els.breakMinutes.disabled = !enabled;
  };

  function tick() {
    state.remainingSeconds--;
    if (state.remainingSeconds < 0) {
      finishPhase();
      return;
    }
    els.timeDisplay.textContent = formatTime(state.remainingSeconds);
    updateRing();
  }

  function startPhase(phase, minutes) {
    state.phase = phase;
    state.totalSeconds = minutes * 60;
    state.remainingSeconds = minutes * 60;
    els.timeDisplay.textContent = formatTime(state.remainingSeconds);
    els.modeLabel.textContent = phase === 'working' ? 'Studying' : 'On break';
    updateRing();
    clearInterval(state.timerId);
    state.timerId = setInterval(tick, 1000);
    els.banner.textContent = '';

    if (phase === 'working') {
      setButtons({ start: false, pause: true, resume: false, stop: true, breakBtn: false, setupEnabled: false });
    } else {
      setButtons({ start: false, pause: true, resume: false, stop: true, breakBtn: false, setupEnabled: false });
    }
  }

  function finishPhase() {
    clearInterval(state.timerId);
    els.timeDisplay.textContent = '00:00';
    updateRing();

    if (state.phase === 'working') {
      logSession(Math.round(state.totalSeconds / 60), state.currentSubject);
      els.modeLabel.textContent = 'Session complete';
      els.banner.textContent = 'Nice work \u2014 session logged.';
      setButtons({ start: false, pause: false, resume: false, stop: false, breakBtn: true, setupEnabled: false });
      renderStats();
    } else if (state.phase === 'break') {
      els.modeLabel.textContent = 'Break over';
      els.banner.textContent = 'Ready when you are.';
      state.phase = 'idle';
      setButtons({ start: true, pause: false, resume: false, stop: false, breakBtn: false, setupEnabled: true });
      els.timeDisplay.textContent = formatTime(parseInt(els.workMinutes.value, 10) * 60);
      state.remainingSeconds = parseInt(els.workMinutes.value, 10) * 60;
      state.totalSeconds = state.remainingSeconds;
      updateRing();
    }
  }

  function logSession(minutes, subject) {
    var sessions = loadSessions();
    sessions.push({
      id: Date.now(),
      subject: subject && subject.trim() ? subject.trim() : 'Untitled session',
      minutes: minutes,
      timestamp: new Date().toISOString()
    });
    saveSessions(sessions);
  }

  els.startBtn.addEventListener('click', function () {
    var minutes = Math.max(1, parseInt(els.workMinutes.value, 10) || 25);
    state.currentSubject = els.subjectInput.value;
    startPhase('working', minutes);
  });

  els.breakBtn.addEventListener('click', function () {
    var minutes = Math.max(1, parseInt(els.breakMinutes.value, 10) || 5);
    startPhase('break', minutes);
  });

  els.pauseBtn.addEventListener('click', function () {
    clearInterval(state.timerId);
    els.modeLabel.textContent = (state.phase === 'working' ? 'Studying' : 'On break') + ' \u2014 paused';
    setButtons({ start: false, pause: false, resume: true, stop: true, breakBtn: false, setupEnabled: false });
  });

  els.resumeBtn.addEventListener('click', function () {
    els.modeLabel.textContent = state.phase === 'working' ? 'Studying' : 'On break';
    state.timerId = setInterval(tick, 1000);
    setButtons({ start: false, pause: true, resume: false, stop: true, breakBtn: false, setupEnabled: false });
  });

  els.stopBtn.addEventListener('click', function () {
    clearInterval(state.timerId);
    state.phase = 'idle';
    els.banner.textContent = 'Stopped \u2014 nothing was logged for this one.';
    els.modeLabel.textContent = 'Ready to study';
    var minutes = Math.max(1, parseInt(els.workMinutes.value, 10) || 25);
    state.remainingSeconds = minutes * 60;
    state.totalSeconds = state.remainingSeconds;
    els.timeDisplay.textContent = formatTime(state.remainingSeconds);
    updateRing();
    setButtons({ start: true, pause: false, resume: false, stop: false, breakBtn: false, setupEnabled: true });
  });

  els.clearBtn.addEventListener('click', function () {
    if (confirm('Clear all logged study sessions? This cannot be undone.')) {
      saveSessions([]);
      renderStats();
    }
  });

  function dateKey(d) {
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function computeStreak(sessions) {
    if (sessions.length === 0) return 0;
    var days = {};
    sessions.forEach(function (s) {
      days[dateKey(new Date(s.timestamp))] = true;
    });
    var streak = 0;
    var cursor = new Date();
    while (true) {
      var key = dateKey(cursor);
      if (days[key]) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function renderChart(sessions) {
    els.chart.innerHTML = '';
    var now = new Date();
    var dayMinutes = [];
    var labels = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(now);
      d.setDate(now.getDate() - i);
      var key = dateKey(d);
      var mins = sessions
        .filter(function (s) { return dateKey(new Date(s.timestamp)) === key; })
        .reduce(function (sum, s) { return sum + s.minutes; }, 0);
      dayMinutes.push(mins);
      labels.push(i === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' }));
    }
    var max = Math.max.apply(null, dayMinutes.concat([1]));
    dayMinutes.forEach(function (mins, idx) {
      var col = document.createElement('div');
      col.className = 'bar-col';
      var bar = document.createElement('div');
      bar.className = 'bar' + (idx === dayMinutes.length - 1 ? ' today' : '');
      var heightPct = Math.max(3, (mins / max) * 100);
      bar.style.height = heightPct + '%';
      bar.title = mins + ' min';
      var label = document.createElement('div');
      label.className = 'bar-day';
      label.textContent = labels[idx];
      col.appendChild(bar);
      col.appendChild(label);
      els.chart.appendChild(col);
    });
  }

  function renderSessionList(sessions) {
    els.sessionList.innerHTML = '';
    if (sessions.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No sessions yet \u2014 start one above.';
      els.sessionList.appendChild(empty);
      return;
    }
    var sorted = sessions.slice().sort(function (a, b) {
      return new Date(b.timestamp) - new Date(a.timestamp);
    }).slice(0, 15);

    sorted.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'session-row';
      var d = new Date(s.timestamp);
      var dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
        ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

      var left = document.createElement('div');
      left.innerHTML = '<span class="subject">' + escapeHtml(s.subject) + '</span><br>' +
        '<span class="meta">' + dateStr + ' \u00b7 ' + s.minutes + ' min</span>';

      var del = document.createElement('button');
      del.className = 'delete';
      del.textContent = '\u00d7';
      del.setAttribute('aria-label', 'Delete session');
      del.addEventListener('click', function () {
        var remaining = loadSessions().filter(function (x) { return x.id !== s.id; });
        saveSessions(remaining);
        renderStats();
      });

      row.appendChild(left);
      row.appendChild(del);
      els.sessionList.appendChild(row);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderStats() {
    var sessions = loadSessions();
    var totalMinutes = sessions.reduce(function (sum, s) { return sum + s.minutes; }, 0);
    els.totalHours.textContent = (totalMinutes / 60).toFixed(1);
    els.totalSessions.textContent = sessions.length;
    els.streak.textContent = computeStreak(sessions);
    renderChart(sessions);
    renderSessionList(sessions);
  }

  // initial state
  state.remainingSeconds = parseInt(els.workMinutes.value, 10) * 60;
  state.totalSeconds = state.remainingSeconds;
  updateRing();
  setButtons({ start: true, pause: false, resume: false, stop: false, breakBtn: false, setupEnabled: true });
  renderStats();
})();
</script>
</body>
</html>
